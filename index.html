<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7490" />
    <meta
      name="description"
      content="Clinical Laboratory Medicine question bank and mock examinations for ASCP, NHPC, PSC, DHA, and AIMS licensure preparation."
    />

    <!-- Apply the saved theme before first paint to avoid a light flash (strict CSP external script) -->
    <script src="/theme-init.js"></script>

    <!-- App Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Self-hosted font preloading -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Base Open Graph & Twitter Cards (Per-route components supply canonical & og:url) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prayogshala Academy" />
    <meta property="og:title" content="Prayogshala Academy" />
    <meta
      property="og:description"
      content="Clinical Laboratory Medicine question bank and mock examinations for ASCP, NHPC, PSC, DHA, and AIMS licensure preparation."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prayogshala Academy" />
    <meta
      name="twitter:description"
      content="Clinical Laboratory Medicine question bank and mock examinations for ASCP, NHPC, PSC, DHA, and AIMS licensure preparation."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Prayogshala Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
