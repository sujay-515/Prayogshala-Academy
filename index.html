<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7490" />
    <meta
      name="description"
      content="Clinical Laboratory Medicine question bank and mock examinations for ASCP, NHPC, PSC, DHA, and AIMS licensure preparation."
    />

    <!-- Apply the saved theme before first paint to avoid a light flash -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var override = params.get('theme');
          var stored = localStorage.getItem('medlab_theme_v1');
          var isDark = override === 'dark'
            ? true
            : override === 'light'
              ? false
              : stored === 'dark' || stored === 'light'
                ? stored === 'dark'
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#060d14');
          }
        } catch (e) {}
      })();
    </script>

    <!-- App Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Base Open Graph & Twitter Cards (Per-route components supply canonical & og:url) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedLab QBank" />
    <meta property="og:title" content="MedLab QBank · Laboratory Medicine Question Bank" />
    <meta
      property="og:description"
      content="Clinical Laboratory Medicine question bank and mock examinations for ASCP, NHPC, PSC, DHA, and AIMS licensure preparation."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedLab QBank · Laboratory Medicine Question Bank" />
    <meta
      name="twitter:description"
      content="Clinical Laboratory Medicine question bank and mock examinations for ASCP, NHPC, PSC, DHA, and AIMS licensure preparation."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <title>MedLab QBank · Clinical Laboratory Medicine Question Bank</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
